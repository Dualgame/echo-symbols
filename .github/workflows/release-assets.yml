name: release-assets
# Attach the JSON copies of data/ (tools/export_json.py) to a GitHub release. They are release files, not commits:
# a committed copy would add tens of MB to the history on every update.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to rebuild the files for (v0.3.0 or later)"
        required: true
permissions:
  contents: write
jobs:
  json:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
      - run: python3 tools/export_json.py --out dist --gzip
      - run: gh release upload "$TAG" dist/*.json.gz --clobber
